[tox]
envlist =
	py311-django{52},
	py311-flake8,
	py37-docs,

[pytest]
django_find_project = false

[testenv]
commands = pytest --cov=oauth2_provider --cov-report= --cov-append {posargs}
setenv =
	DJANGO_SETTINGS_MODULE = tests.settings
	PYTHONPATH = {toxinidir}
	PYTHONWARNINGS = all
deps =
	django52: Django>=5.2,<5.3
	djangorestframework
	oauthlib>=3.1.0
	coverage
	pytest
	pytest-cov
	pytest-django
	pytest-xdist
	requests

[testenv:py37-docs]
basepython = python3.7
changedir = docs
allowlist_externals = make
commands = make html
deps = sphinx<3
       oauthlib>=3.1.0
       m2r>=0.2.1

[testenv:py311-flake8]
skip_install = True
commands =
	flake8 {toxinidir}
deps =
	flake8
	flake8-isort
	flake8-quotes

[testenv:install]
deps =
    twine
    setuptools>=39.0
    wheel
allowlist_externals=
    rm
commands =
    rm -rf dist
    python setup.py sdist bdist_wheel
    twine upload dist/*


[coverage:run]
source = oauth2_provider
omit = */migrations/*

[flake8]
max-line-length = 110
exclude = docs/, oauth2_provider/migrations/, tests/migrations/, .tox/
application-import-names = oauth2_provider
inline-quotes = double

[isort]
balanced_wrapping = True
default_section = THIRDPARTY
known_first_party = oauth2_provider
line_length = 80
lines_after_imports = 2
multi_line_output = 5
skip = oauth2_provider/migrations/, .tox/
