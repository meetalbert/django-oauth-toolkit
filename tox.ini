[tox]
envlist =
    py39-django32,
    py311-django52,
    docs,
    flake8

[testenv]
commands = python runtests.py
deps =
    oauthlib==1.0.1

[testenv:py39-django32]
basepython = python3.9
deps =
    {[testenv]deps}
    Django==3.2.16
    djangorestframework==3.11.2

[testenv:py311-django52]
basepython = python3.11
deps =
    {[testenv]deps}
    Django>=5.2,<5.3
    djangorestframework==3.16.1

[testenv:docs]
basepython=python
changedir=docs
deps =
    sphinx
    south
commands=make html

[testenv:flake8]
deps =
    flake8
commands =
    flake8 oauth2_provider

[flake8]
max-line-length = 120
ignore = F403,F401
exclude = docs,migrations,south_migrations,.tox
